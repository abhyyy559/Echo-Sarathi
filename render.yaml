# Render Blueprint — FREE TIER production demo stack.
#
# Only the FastAPI backend runs here. The other pieces are free services that
# Render cannot host on its free plan:
#   - Frontend       -> Vercel (see frontend/vercel.json)
#   - Voice worker   -> LiveKit Cloud agent deployment (scripts/deploy/deploy-livekit.ps1)
#   - Postgres       -> Neon free (no 30-day expiry; Render free Postgres expires)
#   - Redis          -> not used by this app (health reports it as "unknown")
#
# Render free web services sleep after 15 minutes without traffic and take
# ~1 minute to wake. Keep the API warm during a demo with
# scripts/deploy/wake.ps1 (or the optional GitHub Actions workflow).
#
# Deploy: Render Dashboard -> New -> Blueprint -> connect this repository.
# Render prompts for every `sync: false` value during the first sync.
# The automated path is scripts/deploy/deploy-all.ps1 (Render API).

services:
  - type: web
    name: echosarathi-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    # Free instances do not support preDeployCommand, so migrations and the
    # idempotent demo seed run at boot. The seed never places a call.
    startCommand: cd backend && alembic upgrade head && python scripts/seed_demo.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # `/` is instant; `/api/health` probes provider egress and can exceed the
    # platform health-check timeout during a provider DNS blip.
    healthCheckPath: /
    envVars:
      # Matches the interpreter the test suite and the voice-worker image use.
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      # Neon connection string. Use the POOLED endpoint (`-pooler` host) but
      # prefix the scheme with the psycopg2 driver:
      #   postgresql+psycopg2://user:pass@ep-xxx-pooler.region.aws.neon.tech/db?sslmode=require
      # psycopg (v3) prepares statements server-side and PgBouncer in
      # transaction mode rejects that; psycopg2 is installed and safe.
      # deploy-render.ps1 applies this rewrite automatically.
      - key: DATABASE_URL
        sync: false
      # Redis is optional and unused by the app; empty string => health shows
      # "unknown" instead of a misleading red dot.
      - key: REDIS_URL
        value: ""

      # The deployed Vercel origin, e.g. https://your-app.vercel.app
      - key: CORS_ORIGINS
        sync: false

      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_TOKEN
        generateValue: true
      # Keep public sign-up closed on a public deployment.
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "false"
      # Google OAuth client id for "Sign in with Google" (optional).
      - key: GOOGLE_CLIENT_ID
        sync: false

      # Demo tenant created by the boot seed. Set a non-default password on
      # any internet-exposed deployment.
      - key: DEMO_EMAIL
        value: demo@example.com
      - key: DEMO_PASSWORD
        sync: false

      # Telephony / calling policy.
      - key: TELEPHONY_PROVIDER
        value: vobiz
      - key: VOBIZ_AUTH_ID
        sync: false
      - key: VOBIZ_AUTH_TOKEN
        sync: false
      - key: VOBIZ_PHONE_NUMBER
        sync: false
      # Comma-separated numbers allowed to receive test calls. No other number
      # can be dialled while consent enforcement is on.
      - key: TEST_PHONE_NUMBERS
        sync: false
      - key: CONSENT_ENFORCEMENT
        value: "true"
      # The test-call route refuses numbers that are not in TEST_PHONE_NUMBERS
      # while this stays false. Real outbound is only ever campaign dialing of
      # consented contacts plus the approved test allowlist.
      - key: ALLOW_ANY_OUTBOUND_NUMBER
        value: "false"
      - key: DIALER_ENABLED
        value: "true"
      - key: DEFAULT_CPS_LIMIT
        value: "1"
      # One live call at a time until multi-job worker capacity is proven.
      - key: DEFAULT_CONCURRENCY_LIMIT
        value: "1"
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: CALLING_HOURS_START
        value: "9"
      - key: CALLING_HOURS_END
        value: "21"

      # LiveKit Cloud room server (also used by the deployed voice agent).
      # LIVEKIT_URL_INTERNAL is the container-facing URL for the media bridge.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_URL_INTERNAL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

      # LLM + speech providers. The voice worker uses the same values, supplied
      # to LiveKit Cloud as agent secrets.
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: SARVAM_TTS_API
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_SECONDARY_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_FALLBACK_CHAIN
        sync: false
      - key: CARTESIA_PRONUNCIATION_DICT_ID
        sync: false

      # Render keeps the repo checkout, so the domain-config JSON files are
      # available. The backend runs from backend/.
      - key: DOMAIN_CONFIGS_DIR
        value: ../domain-configs
