<!doctype html>
<html lang="en" style="background: #0a0a0b">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <script>
      // Apply the saved theme before first paint: no dark->light flash.
      try {
        var t = localStorage.getItem('es-theme');
        if (t === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.style.background = '#faf7f1';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#faf7f1');
        } else {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) { /* private mode: stay dark */ }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Echo Sarathi — AI Voice Calling Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
