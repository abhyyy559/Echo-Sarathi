<!doctype html>
<html lang="en" style="background: #0a0a0b">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 46 26'%3E%3Cg fill='none' stroke='%23c9c2b4' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M10 7.3a7 7 0 0 1 0 11.4'/%3E%3Cpath d='M12.9 3.2a12 12 0 0 1 0 19.6'/%3E%3Cpath d='M36 7.3a7 7 0 0 0 0 11.4'/%3E%3Cpath d='M33.1 3.2a12 12 0 0 0 0 19.6'/%3E%3C/g%3E%3Ccircle cx='6' cy='13' r='2.4' fill='%23c9c2b4'/%3E%3Ccircle cx='40' cy='13' r='2.4' fill='%23c9c2b4'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint: no dark->light flash.
      try {
        var t = localStorage.getItem('es-theme');
        if (t === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.style.background = '#faf7f1';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#faf7f1');
        } else {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) { /* private mode: stay dark */ }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Echo Sarathi — AI Voice Calling Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
