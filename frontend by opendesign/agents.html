<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents — Echo Sarathi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
.agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.acard{padding:20px;display:flex;flex-direction:column;gap:12px;transition:.25s}
.acard:hover{transform:translateY(-3px);border-color:rgba(233,228,218,.35)}
.acard .top{display:flex;align-items:center;gap:10px}
.sdot{width:9px;height:9px;border-radius:50%}
.sdot.published{background:var(--green);box-shadow:0 0 8px rgba(16,185,129,.6)}
.sdot.draft{background:var(--dim)}
.acard h3{font-family:var(--font-d);font-size:16.5px;font-weight:600}
.vchip{margin-left:auto;font-family:var(--font-m);font-size:11px;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:2px 8px}
.acard p{font-size:13.5px;color:var(--muted);line-height:1.6;flex:1}
.acard .meta{font-size:11.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.acard .acts{display:flex;gap:8px;padding-top:4px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="shell-mount"></div>

<script src="assets/app.js"></script>
<script>
ES.shell({
  active:'agents',
  title:'Agents',
  subtitle:'Reusable conversation workers — every save creates a new version.',
  action:`<a class="btn primary" href="agent-builder.html">+ New Agent</a>`,
  body:`<div class="agent-grid" id="agrid"></div>`
});

document.getElementById('agrid').innerHTML=ES.AGENTS.map(a=>`
  <div class="card acard">
    <div class="top"><span class="sdot ${a.status}"></span><h3>${a.name}</h3><span class="vchip">v${a.version}</span></div>
    <p>${a.desc}</p>
    <div class="meta">Updated ${a.updated} · ${a.status}</div>
    <div class="acts">
      <a class="btn sm primary" href="playground.html?agent=${a.id}">Test</a>
      <a class="btn sm ghost" href="agent-detail.html?id=${a.id}">Configure</a>
    </div>
  </div>`).join('');

setTimeout(()=>ES.toast('4 agents loaded','info'),500);
</script>
</body>
</html>
