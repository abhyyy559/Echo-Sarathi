<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview — Echo Sarathi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="shell-mount"></div>

<script src="assets/app.js"></script>
<script>
ES.shell({
  active:'overview',
  title:'Overview',
  subtitle:'Health of your voice operations, updated live.',
  action:`<a class="btn primary" href="playground.html">Test an agent</a>`,
  body:`
  <div class="grid g5">
    <div class="card stat"><div class="lbl">Total calls</div><div class="num" id="st-calls">—</div><div class="foot" id="st-done">— completed</div></div>
    <div class="card stat"><div class="lbl">Success rate</div><div class="num" id="st-rate">—</div><div class="foot">answered &amp; completed</div></div>
    <div class="card stat"><div class="lbl">Median latency</div><div class="num" id="st-lat">—</div><div class="foot"><span class="badge ok" id="st-badge">✓ on target ≤900ms</span></div></div>
    <div class="card stat"><div class="lbl">Fields captured</div><div class="num" id="st-fields">—</div><div class="foot">structured data points</div></div>
    <div class="card stat"><div class="lbl">Est. spend</div><div class="num" id="st-spend">$—</div><div class="foot" id="st-mins">— min this month</div></div>
  </div>

  <div class="grid g2" style="margin-top:18px">
    <div class="card">
      <div class="card-h"><h3>Calls — last 7 days</h3><span>all agents</span></div>
      <div style="padding:20px 22px">
        <div class="chart" id="chart7"></div>
      </div>
      <div style="padding:0 22px 16px;font-size:12px;color:var(--dim)">Latency targets — median ≤900ms · p95 ≤1500ms. Bars show total calls per day.</div>
    </div>
    <div class="card">
      <div class="card-h"><h3>Recent calls</h3><a href="calls.html" style="color:var(--brand);font-size:13px">View all →</a></div>
      <table class="tbl">
        <thead><tr><th>#</th><th>Status</th><th>Agent</th><th>When</th></tr></thead>
        <tbody id="recentBody"></tbody>
      </table>
    </div>
  </div>`
});

const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const counts=[38,52,41,64,47,12,29];
document.getElementById('chart7').innerHTML=days.map((d,i)=>`
  <div class="bar" data-v="${counts[i]}"><i data-tip="${counts[i]} calls · ${d}"></i><em>${d}</em></div>`).join('');
[...document.querySelectorAll('#chart7 .bar i')].forEach((el,i)=>setTimeout(()=>{el.style.height=(counts[i]/70*100)+'%'},i*70));

function renderRecent(){
  const rows=ES.CALLS.slice(0,8).map(c=>`
    <tr onclick="location.href='call-detail.html'">
      <td class="mono">#${c.id}</td>
      <td>${ES.chip(c.status)}</td>
      <td>${c.agent}</td>
      <td class="mono">${c.started}${c.duration?` · ${ES.fmtDur(c.duration)}`:''}</td>
    </tr>`).join('');
  document.getElementById('recentBody').innerHTML=rows;
}
renderRecent();

let live=1243,captured=5312,mins=4860;
ES.poll(()=>{
  live+=ES.ri(1,4);
  if(Math.random()<.7){captured+=ES.ri(3,9);mins+=ES.ri(1,6)}
  const done=Math.floor(live*.78), rate=(done/live*100).toFixed(1), med=830+((live%37)*2-20);
  document.getElementById('st-calls').textContent=live.toLocaleString();
  document.getElementById('st-done').textContent=`${done.toLocaleString()} completed`;
  document.getElementById('st-rate').textContent=rate+'%';
  document.getElementById('st-lat').textContent=med+' ms';
  document.getElementById('st-badge').className='badge '+(med<=900?'ok':'warn');
  document.getElementById('st-badge').textContent=med<=900?'✓ on target ≤900ms':'▲ over target';
  document.getElementById('st-fields').textContent=captured.toLocaleString();
  document.getElementById('st-spend').textContent='$'+(mins*.008).toFixed(2);
  document.getElementById('st-mins').textContent=mins.toLocaleString()+' min this month';
},6000);

setTimeout(()=>ES.toast('Live feed connected — updates every 6s','info'),800);
</script>
</body>
</html>
