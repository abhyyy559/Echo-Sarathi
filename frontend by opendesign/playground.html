<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground — Echo Sarathi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
.pg{display:grid;grid-template-columns:1fr 320px;gap:20px}
@media(max-width:1050px){.pg{grid-template-columns:1fr}}
.orb-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:34px 0 10px}
.big-orb{position:relative;width:130px;height:130px;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 35% 30%,#2b1f0f,#151007);display:flex;align-items:center;justify-content:center;transition:.3s}
.big-orb::before,.big-orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1.5px solid rgba(233,228,218,.4);opacity:0}
.big-orb.live::before{animation:ring2 1.7s ease-out infinite}
.big-orb.live::after{animation:ring2 1.7s .5s ease-out infinite}
@keyframes ring2{from{transform:scale(.9);opacity:.8}to{transform:scale(1.3);opacity:0}}
.big-orb[data-m="speaking"]{box-shadow:0 0 50px rgba(245,242,236,.28);background:radial-gradient(circle at 35% 30%,#1e1e23,#0f0f12)}
.big-orb[data-m="listening"]{box-shadow:0 0 50px rgba(233,228,218,.3)}
.big-orb[data-m="interrupted"]{box-shadow:0 0 50px rgba(224,110,95,.32)}
.caps{min-height:240px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:300px;margin-top:18px}
.cap-bub{max-width:80%;padding:11px 15px;border-radius:15px;font-size:14.5px;line-height:1.55;animation:fIn .3s ease}
.cap-bub.caller{align-self:flex-start;background:var(--surface2);border:1px solid var(--line)}
.cap-bub.agent{align-self:flex-end;background:var(--brand-soft);border:1px solid rgba(233,228,218,.3)}
.cap-who{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:4px;display:block}
.frow2{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed rgba(148,163,205,.12);font-size:13.5px}
.frow2:last-child{border:none}
.frow2 .k{color:var(--dim);font-family:var(--font-m);font-size:12px}
.confchip{font-size:10.5px;border-radius:5px;padding:2px 6px;font-family:var(--font-m)}
.confchip.hi{background:rgba(16,185,129,.13);color:var(--green)}
.confchip.md{background:var(--gold-soft);color:var(--gold)}
.mode-toggle{display:flex;background:var(--surface2);border:1px solid var(--line);padding:4px;border-radius:10px;width:max-content;margin-top:16px}
.mode-toggle button{padding:8px 20px;border-radius:7px;font-size:13px;color:var(--muted)}
.mode-toggle button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.tchat{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;margin-top:14px}
</style>
</head>
<body>
<div id="shell-mount"></div>

<script src="assets/app.js"></script>
<script>
ES.shell({
  active:'playground',
  title:'Playground',
  subtitle:'Test any agent safely — nothing is dialed, zero telephony minutes.',
  action:`<span class="badge ok" style="font-size:12px">● sandbox</span>`,
  body:`
  <div class="banner cyan">Nothing is dialed in the playground — sessions run fully in-browser and never consume phone minutes.</div>
  <div class="pg">
    <div class="card" id="mainPane"></div>
    <aside class="card pad" id="sidePane">
      <b style="font-size:13px">Extracted fields <span style="color:var(--dim);font-weight:400">· live</span></b>
      <div id="fieldsBox" style="margin-top:8px"><p class="hint">Start a session to watch fields fill in real time.</p></div>
      <div id="latBox" style="margin-top:18px"></div>
    </aside>
  </div>`
});

const main=document.getElementById('mainPane');
let textMode=false;

function renderSetup(){
  main.innerHTML=`
    <div class="card-h"><h3>Set up a test session</h3><span>v-pinned agents only</span></div>
    <div style="padding:24px">
      <div class="fieldrow"><label>Agent</label><select id="sel-agent">${ES.AGENTS.filter(a=>a.status==='published').map(a=>`<option value="${a.id}">${a.name} — v${a.version}</option>`).join('')}</select></div>
      <div class="fieldrow"><label>Sample contact card (optional)</label>
        <div class="rowflex" style="margin-top:4px">
          <input id="f-student" value="Anika Rao" placeholder="student_name">
          <input id="f-parent" value="Mr. Rao" placeholder="parent_name">
        </div>
        <div class="hint">These columns are spoken naturally by the agent during the session.</div></div>
      <div class="mode-toggle"><button class="on" data-m="voice">Voice session</button><button data-m="text">Text mode</button></div>
      <div style="display:flex;gap:12px;margin-top:26px">
        <button class="btn primary" id="startBtn" style="padding:13px 26px">Start Voice Session</button>
        <button class="btn ghost" id="startTxt">Start in Text Mode</button>
      </div>
    </div>`;
  document.getElementById('startBtn').onclick=()=>startVoice();
  document.getElementById('startTxt').onclick=()=>startText();
}

function setFields(vals){
  document.getElementById('fieldsBox').innerHTML=Object.entries(vals).map(([k,v])=>{
    if(v==null)return `<div class="frow2"><span class="k">${k}</span><span style="color:var(--dim)">— not captured yet</span></div>`;
    const conf=v[1];
    return `<div class="frow2"><span class="k">${k}</span><span>${v[0]} <span class="confchip ${conf>=85?'hi':'md'}">${conf}%</span></span></div>`;
  }).join('');
}
function addLat(stt,llm,tts,e2e){
  const box=document.getElementById('latBox');
  const pct=Math.min(e2e/2000*100,100);
  box.innerHTML+=`
   <div style="margin-top:12px">
     <div class="latmeta"><span>E2E this turn</span><span style="font-family:var(--font-m);color:${e2e>1500?'var(--red)':e2e>900?'var(--amber)':'var(--brand)'}">${e2e} ms</span></div>
     <div class="latbar ${e2e>1500?'bad':e2e>900?'slow':''}"><b style="width:${pct}%"></b><u class="t1"></u><u class="t2"></u></div>
     <div class="latmeta"><span>STT ${stt} · LLM ${llm} · TTS ${tts}</span><span>ticks: 900 / 1500ms</span></div>
   </div>`;
}

let state='idle',wordIv=null,pending=null,timerIv=null,sec=0;
const orbStates={idle:'idle',connecting:'connecting',listening:'listening',speaking:'speaking',interrupted:'interrupted',completed:'completed'};
function setState(s){
  state=s;
  const o=document.querySelector('.big-orb');if(o){o.dataset.m=s==='connecting'?'listening':s;o.classList.toggle('live',s!=='idle'&&s!=='completed')}
  const chipEl=document.getElementById('stateChip');
  if(chipEl){chipEl.dataset.s=s==='connecting'?'listening':s;chipEl.textContent={idle:'Idle',connecting:'Connecting…',listening:'Listening',speaking:'Agent speaking',interrupted:'Interrupted — yielding',processing:'Thinking…',completed:'Completed'}[s]}
}
function bub(who,text,instant){
  const caps=document.getElementById('caps');
  const b=document.createElement('div');b.className='cap-bub '+who;
  b.innerHTML=`<span class="cap-who">${who==='agent'?'Agent':'Caller'}</span><span class="txt"></span>`;
  caps.appendChild(b);caps.scrollTop=caps.scrollHeight;
  if(instant){b.querySelector('.txt').textContent=text;return Promise.resolve()}
  const words=text.split(' ');let i=0;
  return new Promise(res=>{pending=res;wordIv=setInterval(()=>{b.querySelector('.txt').textContent=words.slice(0,++i).join(' ');caps.scrollTop=caps.scrollHeight;if(i>=words.length){clearInterval(wordIv);pending=null;res()}},who==='agent'?110:150)});
}
function stopSpeech(){if(pending){clearInterval(wordIv);const r=pending;pending=null;r()}}
function choice(opts){
  return new Promise(res=>{
    const bar=document.getElementById('choiceBar');bar.innerHTML='';
    opts.forEach(o=>{const b=document.createElement('button');b.className='btn sm ghost';b.textContent=o;b.onclick=()=>{bar.innerHTML='';bub('caller',o,true).then(()=>res(o))};bar.appendChild(b)});
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function startVoice(){
  const agentSel=document.getElementById('sel-agent'),agentName=agentSel.selectedOptions[0].textContent.split(' — ')[0];
  const student=document.getElementById('f-student').value||'the student',parent=document.getElementById('f-parent').value||'there';
  main.innerHTML=`
    <div class="card-h">
      <h3>${agentName} · live session</h3>
      <span class="chip in-progress" id="stateChip"><i></i>Idle</span>
    </div>
    <div style="padding:10px 26px 26px">
      <div class="orb-wrap">
        <button class="big-orb" aria-label="Session orb">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" fill="#e9e4da"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke="#e9e4da" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="btn danger sm" id="intBtn" style="opacity:0;pointer-events:none">Interrupt agent</button>
        <span class="mono" style="font-size:12px;color:var(--dim)" id="ptimer">00:00</span>
      </div>
      <div class="caps" id="caps"></div>
      <div style="display:flex;gap:10px;margin-top:16px;min-height:36px" id="choiceBar"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:14px">
        <button class="btn ghost sm" id="endBtn">End session</button>
      </div>
    </div>`;
  document.getElementById('endBtn').onclick=endSession;
  document.getElementById('intBtn').onclick=()=>{
    stopSpeech();setState('interrupted');
    setTimeout(async()=>{setState('speaking');await bub('agent','Of course — go ahead.');turnLat();setState('listening')},420);
  };
  sec=0;timerIv=setInterval(()=>{sec++;document.getElementById('ptimer').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`},1000);
  document.getElementById('latBox').innerHTML='';
  setState('connecting');await wait(800);
  setState('listening');
  await wait(500);
  setFields({student_name:[student.split(' ')[0],94],parent_name:[parent,96],present_today:null,reason:null,callback_requested:null});
  setState('speaking');
  await bub('agent',`Hello, am I speaking with ${parent}? This is Sarathi from Sunrise Academy about ${student.split(' ')[0]}’s attendance.`);
  turnLat();
  const a1=await choice(['Yes, speaking.','Sorry, who is this?']);
  if(a1.startsWith('Sorry')){setState('speaking');await bub('agent','No problem — I’m the school’s calling assistant. May I quickly confirm today’s attendance?');turnLat()}
  const a2=await choice([`${student.split(' ')[0]} is unwell today.`,`${student.split(' ')[0]} will be there.`]);
  setState('thinking');await wait(600);
  if(a2.includes('unwell')){
    setFields({student_name:[student.split(' ')[0],94],parent_name:[parent,96],present_today:['No',91],reason:['Sick leave',88],callback_requested:null});
    setState('speaking');
    await bub('agent','Thank you — sorry to hear that. Should I ask the class teacher to call you back this evening?');
    turnLat();
    const a3=await choice(['Yes, please.','No, that’s fine.']);
    setFields({student_name:[student.split(' ')[0],94],parent_name:[parent,96],present_today:['No',91],reason:['Sick leave',88],callback_requested:[a3.startsWith('Yes')?'Yes':'No',90]});
    setState('speaking');
    await bub('agent','All noted and logged for the register. Wishing a quick recovery — thank you!');
    turnLat();
  }else{
    setFields({student_name:[student.split(' ')[0],94],parent_name:[parent,96],present_today:['Yes',93],reason:['Attending',87],callback_requested:['No',84]});
    setState('speaking');
    await bub('agent','Wonderful, that’s recorded for today’s register. Thank you — have a great day!');
    turnLat();
  }
  finishSummary(agentName);
}
function prev(){return{student_name:['Anika',94],parent_name:['Mr. Rao',96],present_today:['No',91],reason:['Sick leave',88],callback_requested:['Yes',90]}}
function turnLat(){addLat(210+Math.floor(Math.random()*60),290+Math.floor(Math.random()*90),180+Math.random()*40|0,650+Math.floor(Math.random()*220))}
function endSession(){
  stopSpeech();clearInterval(timerIv);
  setState('completed');
  ES.toast('Session ended — nothing was dialed','info');
  finishSummary('Absentee Follow-up');
}
function finishSummary(name){
  const dur=document.getElementById('ptimer').textContent;
  const caps=document.getElementById('caps');
  caps.innerHTML+=`
   <div style="align-self:stretch;border:1px solid rgba(16,185,129,.35);border-radius:12px;padding:14px 16px;margin-top:10px;animation:fIn .4s ease">
     <b style="color:var(--green);font-size:12px;letter-spacing:.14em;text-transform:uppercase">Session summary</b>
     <p style="font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.6">Duration ${dur} · 5 of 5 fields captured · transcript available · zero minutes used.</p>
     <div style="display:flex;gap:10px;margin-top:12px">
       <button class="btn sm ghost" onclick="renderSetup()">Start again</button>
       <a class="btn sm primary" href="call-detail.html">View as call report</a>
     </div>
   </div>`;
  caps.scrollTop=caps.scrollHeight;
  setState('completed');
  clearInterval(timerIv);
}

function startText(){
  main.innerHTML=`
    <div class="card-h"><h3>Text mode · same extraction pipeline</h3><span class="chip queued"><i></i>sandbox</span></div>
    <div style="padding:20px 24px">
      <div class="tchat" id="tcaps"></div>
      <div style="display:flex;gap:10px;margin-top:14px">
        <input id="t-in" placeholder="Type as the caller…">
        <button class="btn primary" id="t-send">Send</button>
      </div>
    </div>`;
  setFields(prev());
  const caps=document.getElementById('tcaps');
  function push(cls,txt){const d=document.createElement('div');d.className='cap-bub '+cls;d.innerHTML=`<span class="cap-who">${cls==='agent'?'Agent':'Caller'}</span>${txt}`;caps.appendChild(d);caps.scrollTop=caps.scrollHeight}
  push('agent','Hello! Ask me anything a parent might say — I’ll reply and extract fields exactly like on a real call.');
  const REPLIES=[['Noted — I’ve captured that.','reason → “sick leave”'],['Thanks! Is there anything else about attendance?','present_today → “no”'],['Understood. Would you like the teacher to call back?','callback_requested → pending']];
  let ri=0;
  const send=()=>{
    const v=document.getElementById('t-in').value.trim();if(!v)return;
    push('caller',v);document.getElementById('t-in').value='';
    setTimeout(()=>{const r=REPLIES[ri++%REPLIES.length];push('agent',r[0]);addLat(205,310,190,705+ri*17)},700);
  };
  document.getElementById('t-send').onclick=send;
  document.getElementById('t-in').onkeydown=e=>{if(e.key==='Enter')send()};
}

renderSetup();
setTimeout(()=>ES.toast('Playground ready — pick an agent and press start','info'),700);
</script>
</body>
</html>
